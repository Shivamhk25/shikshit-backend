version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: shikshit-postgres
    environment:
      POSTGRES_DB: shikshit
      POSTGRES_USER: shikshit
      POSTGRES_PASSWORD: shikshit_dev_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Migrations are applied with `make migrate-up` (golang-migrate); initdb only creates the dev roles.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shikshit -d shikshit"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shikshit-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # PgBouncer for connection pooling
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: shikshit-pgbouncer
    environment:
      DATABASES_HOST: postgres
      DATABASES_PORT: 5432
      DATABASES_DBNAME: shikshit
      DATABASES_USER: shikshit
      DATABASES_PASSWORD: shikshit_dev_password
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 25
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      RESERVE_POOL_TIMEOUT: 5
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shikshit-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Redis
  redis:
    image: redis:7-alpine
    container_name: shikshit-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shikshit-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  minio:
    image: minio/minio:latest
    container_name: shikshit-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - shikshit-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Mailhog for email testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: shikshit-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - shikshit-network

networks:
  shikshit-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data: