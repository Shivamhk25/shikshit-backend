version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: pie360-postgres
    environment:
      POSTGRES_DB: pie360
      POSTGRES_USER: pie360
      POSTGRES_PASSWORD: pie360_dev_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Migrations are applied with `make migrate-up` (golang-migrate); initdb only creates the dev roles.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pie360 -d pie360"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pie360-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # PgBouncer for connection pooling
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pie360-pgbouncer
    environment:
      DATABASES_HOST: postgres
      DATABASES_PORT: 5432
      DATABASES_DBNAME: pie360
      DATABASES_USER: pie360
      DATABASES_PASSWORD: pie360_dev_password
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 25
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      RESERVE_POOL_TIMEOUT: 5
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pie360-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Redis
  redis:
    image: redis:7-alpine
    container_name: pie360-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pie360-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pie360-api
    environment:
      - APP_ENV=development
      - APP_HOST=0.0.0.0
      - APP_PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=pie360
      - DB_PASSWORD=pie360_dev_password
      - DB_NAME=pie360
      - DB_SSL_MODE=disable
      - DB_PGBOUNCER_HOST=pgbouncer
      - DB_PGBOUNCER_PORT=6432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - JWT_PRIVATE_KEY_PATH=./keys/private.pem
      - JWT_PUBLIC_KEY_PATH=./keys/public.pem
      - JWT_ACCESS_TOKEN_TTL=15m
      - JWT_REFRESH_TOKEN_TTL=168h
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - pie360-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./migrations:/app/migrations:ro

  # MinIO for file storage
  minio:
    image: minio/minio:latest
    container_name: pie360-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - pie360-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Mailhog for email testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: pie360-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - pie360-network

networks:
  pie360-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data: