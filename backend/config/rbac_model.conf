# Casbin RBAC Model Configuration
# Request definition: subject, object, action
[request_definition]
r = sub, obj, act

# Policy definition: subject, object, action
[policy_definition]
p = sub, obj, act

# Role definition: user, role
[role_definition]
g = _, _

# Domain/tenant definition
[role_definition]
g2 = _, _, _

# Policy effect: allow if any policy matches
[policy_effect]
e = some(where (p.eft == allow))

# Matchers: match subject roles and domain
[matchers]
m = g(r.sub, p.sub) && g2(r.sub, r.obj, p.sub) && r.obj == p.obj && r.act == p.act
# Alternative simpler matcher without domain:
# m = g(r.sub, p.sub) && r.obj == p.obj && r.act == p.act