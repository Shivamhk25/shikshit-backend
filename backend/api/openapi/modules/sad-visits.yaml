# SAD-05 read-only support visits (decision 0018, APPROVALS A-11 option A). Written by hand.
# A platform user gives a reason and gets a one-time code; redeemed on the school's address it opens a 30-minute
# read-only session. Every read is in the school's audit trail with the reason.
paths:
  /platform/institutes/{instituteId}/visits:
    parameters:
      - name: instituteId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: startSupportVisit
      summary: Start a read-only support visit to a school
      description: |
        Only onboarding and live schools can be visited. The one-time code is returned once; open
        `https://<instituteCode>.<domain>/support-visit?code=<code>`. It must be used before the visit expires (30 minutes).
      tags: [platform]
      x-platform: true
      x-module: sad
      x-parity: Web-only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, maxLength: 500, description: The school sees this. }
      responses:
        '201':
          description: Started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportVisitStart' }
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthorized'
        '409':
          $ref: '../components/common.yaml#/components/responses/Conflict'
  /auth/support-visit:
    post:
      operationId: redeemSupportVisit
      summary: Open a support visit on the school's address
      description: |
        Trades the one-time code for an access token that ends with the visit (no refresh token). The token can only
        read; every read is audited. An unknown, used or expired code answers 401 `invalid_visit_code`.
      tags: [auth]
      security: []
      x-public: true
      x-module: platform
      x-parity: Web-only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, minLength: 20, maxLength: 128 }
      responses:
        '200':
          description: The visit's token.
          content:
            application/json:
              schema: { $ref: './auth.yaml#/components/schemas/TokenResponse' }
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthorized'
  /support-visit/end:
    post:
      operationId: endSupportVisit
      summary: End the current support visit
      description: The visit's token stops working at once. Only a support visit can call this.
      tags: [auth]
      x-authenticated: true
      x-module: platform
      x-parity: Web-only
      responses:
        '204':
          description: Ended.
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../components/common.yaml#/components/responses/Forbidden'
components:
  schemas:
    SupportVisitStart:
      type: object
      required: [visitId, code, instituteCode, expiresAt]
      properties:
        visitId: { type: string, format: uuid }
        code: { type: string, description: One-time; shown once. }
        instituteCode: { type: string }
        expiresAt: { type: string, format: date-time }
    SupportVisitInfo:
      type: object
      description: Present only during a read-only support visit, so the app shows a banner.
      required: [by, reason, expiresAt]
      properties:
        by: { type: string, description: The platform user's name. }
        reason: { type: string }
        expiresAt: { type: string, format: date-time }
