# Alumni (STU-10): former students, read from records that already exist (promotions and transfers). Read-only.
# The list never shows why a transfer was made. Only holders of the permission for the whole school may use it
# (a class-section grant is refused with 403), and every read is audited.
paths:
  /alumni:
    get:
      operationId: listAlumni
      summary: List former students
      description: |
        Needs `stu.alumni.view` institute-wide. Every read is audited (never the search text). A former student is one
        whose status is `alumni` (graduated through a committed promotion) or `transferred`. `q` matches the name,
        registration code and TC number. `yearId` and `classId` are those of the last enrolment. `exitDate` is empty
        when it cannot be known (status set by hand, with no committed graduation or completed transfer behind it).
      tags: [stu]
      x-permission: stu.alumni.view
      x-module: stu
      x-parity: Companion
      parameters:
        - $ref: '../components/common.yaml#/components/parameters/Page'
        - $ref: '../components/common.yaml#/components/parameters/PageSize'
        - name: sort
          in: query
          description: Comma-separated keys, `-` prefix for descending. Allowed `student, class, year, reason, exit`. Default `-exit`; unknown exit dates sort last.
          schema: { type: string }
        - $ref: '../components/common.yaml#/components/parameters/Search'
        - name: reason
          in: query
          schema: { $ref: '#/components/schemas/AlumniReason' }
        - name: classId
          in: query
          schema: { type: string, format: uuid }
        - name: yearId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlumniPage'
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../components/common.yaml#/components/responses/Forbidden'
  /alumni/{studentId}:
    parameters:
      - name: studentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getAlumnus
      summary: One former student
      description: Needs `stu.alumni.view` institute-wide. The read is audited. A student who has not left answers 404.
      tags: [stu]
      x-permission: stu.alumni.view
      x-module: stu
      x-parity: Companion
      responses:
        '200':
          description: The former student.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alumnus'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../components/common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
components:
  schemas:
    AlumniReason:
      type: string
      enum: [graduated, transferred, other]
    Alumnus:
      type: object
      required: [id, name, registrationCode, admissionDate, lastClassName, lastSectionName, yearName, reason, reasonLabel, exitDate, tcNumber, destinationSchool, lastAttendanceDate]
      properties:
        id: { type: string, format: uuid, description: "The student's id." }
        name: { type: string }
        registrationCode: { type: string }
        admissionDate: { type: string, format: date, nullable: true }
        lastClassName: { type: string, nullable: true, description: "Class of the last enrolment (the one graduated from or transferred out of)." }
        lastSectionName: { type: string, nullable: true }
        yearName: { type: string, nullable: true, description: "Academic year of the last enrolment." }
        reason: { $ref: '#/components/schemas/AlumniReason' }
        reasonLabel: { type: string }
        exitDate: { type: string, format: date, nullable: true, description: "Graduated: the day the promotion was committed. Transferred: the date on the transfer certificate. Null when not known." }
        tcNumber: { type: string, nullable: true, description: "Transferred students only." }
        destinationSchool: { type: string, nullable: true }
        lastAttendanceDate: { type: string, format: date, nullable: true }
    AlumniPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Alumnus' }
        page:
          $ref: '../components/common.yaml#/components/schemas/PageInfo'
