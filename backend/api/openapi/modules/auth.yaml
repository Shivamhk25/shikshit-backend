# Authentication: password sign-in, refresh-token rotation and sign-out for institute users.
# The institute is taken from the request host (never from a header or the body).
# Google sign-in and MFA are added by later work items on top of the same token model.
paths:
  /auth/login:
    post:
      operationId: login
      summary: Sign in with username and password
      description: |
        Wrong username, wrong password, disabled account and Google-only account all return the same
        `401 invalid_credentials`, so the response does not reveal which usernames exist.
        After repeated failures the account locks; a correct password then returns `423 account_locked`.
      tags: [auth]
      security: []
      x-public: true
      x-module: platform
      x-parity: Both
      parameters:
        - $ref: '#/components/parameters/XClient'
        - $ref: '#/components/parameters/XClientVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '202':
          description: |
            Password correct, a second step is needed (two-step sign-in, FND-05). No tokens yet: send a code to
            `/auth/mfa/verify`, or for `setup` get a secret from `/auth/mfa/setup` and confirm a code.
          content:
            application/json:
              schema:
                $ref: './auth-mfa.yaml#/components/schemas/MfaChallenge'
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthorized'
        '423':
          description: The account is temporarily locked after too many failed attempts.
          content:
            application/problem+json:
              schema:
                $ref: '../components/common.yaml#/components/schemas/Problem'
  /auth/refresh:
    post:
      operationId: refreshToken
      summary: Exchange a refresh token for new tokens
      description: |
        Refresh tokens rotate: each use returns a new one and invalidates the old one.
        Web clients (`X-Client: web`) keep the refresh token in an httpOnly cookie that scripts cannot read: send no body and
        the cookie is used. Mobile clients send the token in the body.
        Presenting an already-used token signs out every device that shared the session (`401 refresh_reuse`).
      tags: [auth]
      security: []
      x-public: true
      x-module: platform
      x-parity: Both
      parameters:
        - $ref: '#/components/parameters/XClient'
        - $ref: '#/components/parameters/XClientVersion'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthorized'
  /auth/logout:
    post:
      operationId: logout
      summary: Sign out this session
      description: |
        Revokes the session the refresh token belongs to (taken from the body, or from the cookie for web clients) and
        clears the cookie. Idempotent; unknown or missing tokens also return 204.
      tags: [auth]
      security: []
      x-public: true
      x-module: platform
      x-parity: Both
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Signed out.
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
components:
  parameters:
    XClient:
      name: X-Client
      in: header
      description: Calling client; stored on the session so users can see their devices. Defaults to web.
      schema: { type: string, enum: [web, ios, android] }
    XClientVersion:
      name: X-Client-Version
      in: header
      schema: { type: string, example: 1.4.0 }
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 64 }
        password: { type: string, minLength: 1, maxLength: 256, format: password }
    RefreshRequest:
      type: object
      properties:
        refreshToken: { type: string, minLength: 20, maxLength: 128 }
    TokenResponse:
      type: object
      required: [accessToken, accessTokenExpiresAt, refreshTokenExpiresAt, mustChangePassword]
      properties:
        accessToken: { type: string, description: Short-lived bearer token (15 minutes). }
        accessTokenExpiresAt: { type: string, format: date-time }
        refreshToken:
          type: string
          description: |
            Opaque single-use token for mobile clients; store it in the platform secure store.
            Omitted for web clients, which receive it as an httpOnly cookie instead.
        refreshTokenExpiresAt: { type: string, format: date-time }
        mustChangePassword: { type: boolean }
