# FND-11 appearance (decision 0005): the institute's accent colour and design preset, and each user's light/dark
# choice. Written by hand. Clients build the theme with @shikshit/shared createTheme(mode, accent, preset).
paths:
  /institute/appearance:
    get:
      operationId: getInstituteAppearance
      summary: The institute's accent colour and design preset
      description: Defaults (navy, classic) when the institute has not chosen. Everyone also gets these in `/me/access` under `tenant.brand`.
      tags: [iam]
      x-permission: iam.appearance.view
      x-module: iam
      x-parity: Companion
      responses:
        '200':
          description: The look.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appearance' }
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../components/common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
    put:
      operationId: setInstituteAppearance
      summary: Change the institute's accent colour and design preset
      description: |
        Any #RRGGBB accent is accepted: clients keep it readable (createTheme raises contrast where needed). Everyone's
        access version changes, so open apps repaint on their next request.
      tags: [iam]
      x-permission: iam.appearance.manage
      x-module: iam
      x-parity: Web-only
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Appearance' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appearance' }
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../components/common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
  /me/preferences:
    get:
      operationId: getMyPreferences
      summary: The signed-in user's personal settings
      tags: [iam]
      x-authenticated: true
      x-module: iam
      x-parity: Both
      responses:
        '200':
          description: The preferences, with defaults for anything not chosen.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthorized'
    put:
      operationId: setMyPreferences
      summary: Change the signed-in user's personal settings
      tags: [iam]
      x-authenticated: true
      x-module: iam
      x-parity: Both
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Preferences' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthorized'
components:
  schemas:
    Appearance:
      type: object
      required: [accent, preset]
      properties:
        accent: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', example: '#1F3A5F' }
        preset:
          type: string
          enum: [classic, modern, contrast]
          description: classic = serif titles, warm paper; modern = sans titles, cooler neutrals, rounder; contrast = high contrast for accessibility.
    Preferences:
      type: object
      required: [themeMode]
      properties:
        themeMode: { type: string, enum: [light, dark, system], description: system follows the device. }
