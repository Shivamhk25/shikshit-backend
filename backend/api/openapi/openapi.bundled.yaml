components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Health:
      type: object
      required:
        - status
        - version
        - time
      properties:
        status:
          type: string
          enum:
            - ok
        version:
          type: string
          example: 0.1.0
        time:
          type: string
          format: date-time
    AccessUser:
      type: object
      required:
        - id
        - name
        - tier
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        tier:
          type: string
          enum:
            - tenant
            - platform
    AccessTenant:
      type: object
      description: The institute the session is bound to. Absent for platform-tier users who have not entered an institute.
      required:
        - id
        - name
        - brand
        - modules
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        brand:
          type: object
          required:
            - primary
          properties:
            primary:
              type: string
              pattern: ^#[0-9A-Fa-f]{6}$
        modules:
          type: array
          items:
            type: string
    NavItem:
      type: object
      description: |
        One navigation entry. Paths and routes are NOT sent; each client resolves `screenId`
        through the shared screen registry (FND-28).
      required:
        - screenId
        - label
        - order
      properties:
        screenId:
          type: string
          example: attendance.capture
        label:
          type: string
        icon:
          type: string
        parentId:
          type: string
          nullable: true
        order:
          type: integer
    AccessPayload:
      type: object
      required:
        - user
        - permissions
        - scopes
        - fieldMasks
        - workspace
        - mobile
        - approvals
        - version
      properties:
        user:
          $ref: '#/components/schemas/AccessUser'
        tenant:
          $ref: '#/components/schemas/AccessTenant'
        permissions:
          type: array
          items:
            type: string
            example: fee.payments.create
        scopes:
          type: object
          description: Resource → scope grants, e.g. `class_section:12`, `own_children:77`.
          additionalProperties:
            type: array
            items:
              type: string
        fieldMasks:
          type: object
          description: Resource → fields the caller must not see (omitted from responses).
          additionalProperties:
            type: array
            items:
              type: string
        workspace:
          type: object
          required:
            - home
            - navigation
          properties:
            home:
              type: string
              example: teacher
            navigation:
              type: array
              items:
                $ref: '#/components/schemas/NavItem'
        mobile:
          type: object
          required:
            - tabs
            - features
          properties:
            tabs:
              type: array
              maxItems: 5
              items:
                type: string
            features:
              type: array
              items:
                type: string
        approvals:
          type: object
          required:
            - canApprove
          properties:
            canApprove:
              type: array
              items:
                type: string
        version:
          type: integer
          description: Increments whenever the caller's roles, grants, scopes or the institute's modules change.
    ProblemFieldError:
      type: object
      description: One field-level validation failure.
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
          example: guardianPhone
        code:
          type: string
          description: Stable machine code; clients map it to a translated message.
          example: invalid_phone
        message:
          type: string
          example: Enter a valid phone number.
    Problem:
      type: object
      description: RFC 9457 problem details. `code` is a stable machine-readable error code.
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Forbidden
        status:
          type: integer
          example: 403
        code:
          type: string
          example: permission_denied
        detail:
          type: string
        instance:
          type: string
        requestId:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ProblemFieldError'
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 256
          format: password
    TokenResponse:
      type: object
      required:
        - accessToken
        - accessTokenExpiresAt
        - refreshTokenExpiresAt
        - mustChangePassword
      properties:
        accessToken:
          type: string
          description: Short-lived bearer token (15 minutes).
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
          description: |
            Opaque single-use token for mobile clients; store it in the platform secure store.
            Omitted for web clients, which receive it as an httpOnly cookie instead.
        refreshTokenExpiresAt:
          type: string
          format: date-time
        mustChangePassword:
          type: boolean
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 20
          maxLength: 128
