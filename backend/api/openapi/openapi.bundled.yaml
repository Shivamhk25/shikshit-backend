          nullable: true
          maxLength: 20
        color:
          type: string
          nullable: true
          pattern: ^#[0-9A-Fa-f]{6}$
        category:
          type: string
          maxLength: 50
          description: Free text until product confirms the list.
        area:
          type: string
          maxLength: 50
          description: Free text until product confirms the list.
        scholastic:
          type: boolean
          default: false
        coScholastic:
          type: boolean
          default: false
        nonScholastic:
          type: boolean
          default: false
        credits:
          type: number
          format: double
          minimum: 0
          maximum: 99.9
          description: Kept to one decimal.
        description:
          type: string
          nullable: true
          maxLength: 500
        status:
