            emailQueued:
              type: boolean
              description: Present with a link. True when the link was also queued for email to the user.
    PhotoUpload:
      type: object
      required:
        - fileId
        - uploadUrl
        - headers
        - expiresAt
      properties:
        fileId:
          type: string
          format: uuid
        uploadUrl:
          type: string
          description: PUT the bytes here.
        headers:
          type: object
          description: Send exactly these headers with the PUT.
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
    PhotoLink:
      type: object
      required:
        - url
        - expiresAt
      properties:
        url:
          type: string
        expiresAt:
          type: string
          format: date-time
  headers:
    AccessVersion:
      description: |
        Current version of the caller's access payload. When it differs from the version the client holds,
        the client refetches `GET /me/access`.
      schema:
        type: integer
  responses:
    Unauthorized:
      description: Missing, expired or invalid credentials.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UpgradeRequired:
      description: The client version is below the minimum supported version; update the app.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotImplemented:
      description: Declared in the contract but not implemented yet.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: The request is malformed or failed validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated, but not permitted (permission, scope or module entitlement).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource does not exist or is not visible to the caller.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Stale write (`If-Match` mismatch) or a uniqueness conflict.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  parameters:
    XClient:
      name: X-Client
      in: header
      description: Calling client; stored on the session so users can see their devices. Defaults to web.
      schema:
        type: string
        enum:
          - web
          - ios
          - android
    XClientVersion:
      name: X-Client-Version
      in: header
      schema:
        type: string
        example: 1.4.0
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
