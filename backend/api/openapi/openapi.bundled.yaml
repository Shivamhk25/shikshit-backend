          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createRoom
      summary: Add a room
      tags:
        - aca
      x-permission: aca.rooms.create
      x-module: aca
      x-parity: Companion
      requestBody:
