          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          description: The account is temporarily locked after too many failed attempts.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/mfa/setup:
    post:
      operationId: startMfaSetup
      summary: New authenticator secret for an Admin who must set up two-step sign-in
      description: For a `setup` challenge. Calling it again replaces the secret.
      tags:
        - auth
      security: []
      x-public: true
      x-module: platform
      x-parity: Both
      requestBody:
        required: true
        content:
          application/json:
            schema:
