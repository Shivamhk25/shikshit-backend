        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: uploadImport
      summary: Upload a CSV or Excel file for checking
      description: |
        The file is read and staged, then checked in the background (poll the batch until `status` is `validated`).
        Nothing is saved to the institute's records until the batch is committed. Limits: 10 MB, 20,000 rows.
      tags:
        - onboarding
      x-permission: onb.imports.import
      x-module: onb
      x-parity: Both
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - entity
                - file
              properties:
                entity:
                  type: string
                  example: school_divisions
                strategy:
                  type: string
                  enum:
                    - insert
                    - update
                    - upsert
                  default: upsert
                commitMode:
                  type: string
                  enum:
                    - all_or_nothing
                    - skip_invalid
                  default: all_or_nothing
                file:
                  type: string
                  format: binary
      responses:
        '202':
          description: Accepted; checking has been queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
