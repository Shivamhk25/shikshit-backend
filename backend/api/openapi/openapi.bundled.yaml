  /platform/auth/login:
    post:
      operationId: platformLogin
      summary: First platform sign-in step (email and password)
      description: |
        A correct password always answers 202 with a challenge: `verify` (enter a code) or `setup` (first sign-in:
        set up an authenticator app). Wrong passwords answer 401 `invalid_credentials` whether or not the email
        exists; 5 in a row lock the account for 15 minutes (423).
      tags:
        - platform
      security: []
      x-public: true
      x-module: platform
      x-parity: Web-only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  maxLength: 254
                password:
                  type: string
                  maxLength: 256
      responses:
        '202':
          description: Password accepted; a second step follows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaChallenge'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          description: Locked after too many failed attempts.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
