        '200':
          description: The active plans, smallest first.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Plan'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /platform/institutes:
    get:
      operationId: listInstitutes
      summary: Institute directory
      description: Search by name or code, filter by status, paged like other lists.
      tags:
        - platform
      x-platform: true
      x-module: sad
      x-parity: Web-only
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sort
          in: query
          description: Comma-separated keys, `-` prefix for descending. Allowed `name, code, status, createdAt`.
          schema:
            type: string
        - $ref: '#/components/parameters/Search'
        - name: status
          in: query
          schema:
            type: string
            enum:
              - onboarding
              - live
              - suspended
              - archived
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createInstitute
      summary: Create an institute (new-institute wizard)
      description: |
        Creates the institute in status `onboarding` with its plan's modules, the default roles and one invited Admin.
        All of it or nothing. The Admin's one-time invite link (7 days) is returned once; it is opened on the
        institute's own address (`https://<code>.<domain>` + `adminInviteLink`).
      tags:
        - platform
      x-platform: true
      x-module: sad
      x-parity: Web-only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstituteCreateInput'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstituteCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /platform/institutes/{instituteId}:
    parameters:
      - name: instituteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getInstitute
      summary: One institute
      tags:
        - platform
      x-platform: true
      x-module: sad
      x-parity: Web-only
      responses:
        '200':
          description: The institute.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Institute'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateInstitute
      summary: Rename an institute or change its plan
      description: Changing the plan does not change the modules; set them with PUT .../modules.
      tags:
        - platform
      x-platform: true
      x-module: sad
      x-parity: Web-only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 200
                planCode:
                  type: string
                  maxLength: 50
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Institute'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /platform/institutes/{instituteId}/status:
    parameters:
      - name: instituteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: setInstituteStatus
      summary: Go live, suspend, reactivate or archive
      description: |
        onboarding → live or archived; live → suspended; suspended → live or archived. Archived is final. Anything else
        answers 409 `invalid_state`. A suspended institute's users are refused on their next request (within 30 seconds).
      tags:
        - platform
      x-platform: true
      x-module: sad
      x-parity: Web-only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - onboarding
                    - live
                    - suspended
                    - archived
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Institute'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /platform/institutes/{instituteId}/modules:
    parameters:
      - name: instituteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: setInstituteModules
      summary: Choose the modules an institute has
      description: |
        Replaces the enabled modules. Only modules some plan includes are accepted, and `iam` is always required.
        Turning a module off keeps its data; it reappears when turned on again. Every user's access version changes.
      tags:
        - platform
      x-platform: true
      x-module: sad
      x-parity: Web-only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - modules
              properties:
                modules:
                  type: array
                  maxItems: 60
                  items:
                    type: string
                    maxLength: 8
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Institute'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /platform/institutes/{instituteId}/visits:
    parameters:
      - name: instituteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: startSupportVisit
      summary: Start a read-only support visit to a school
      description: |
        Only onboarding and live schools can be visited. The one-time code is returned once; open
        `https://<instituteCode>.<domain>/support-visit?code=<code>`. It must be used before the visit expires (30 minutes).
      tags:
        - platform
      x-platform: true
      x-module: sad
      x-parity: Web-only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  minLength: 10
                  maxLength: 500
                  description: The school sees this.
      responses:
        '201':
          description: Started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportVisitStart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/support-visit:
    post:
      operationId: redeemSupportVisit
      summary: Open a support visit on the school's address
      description: |
        Trades the one-time code for an access token that ends with the visit (no refresh token). The token can only
        read; every read is audited. An unknown, used or expired code answers 401 `invalid_visit_code`.
      tags:
        - auth
      security: []
      x-public: true
      x-module: platform
      x-parity: Web-only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  minLength: 20
                  maxLength: 128
      responses:
        '200':
          description: The visit's token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /support-visit/end:
    post:
      operationId: endSupportVisit
      summary: End the current support visit
      description: The visit's token stops working at once. Only a support visit can call this.
      tags:
        - auth
      x-authenticated: true
      x-module: platform
      x-parity: Web-only
      responses:
        '204':
          description: Ended.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /platform/users:
    get:
      operationId: listPlatformUsers
      summary: The Shikshit team's platform accounts
      tags:
        - platform
      x-platform: true
      x-module: sad
      x-parity: Web-only
      responses:
        '200':
          description: Active first, then invited, then disabled.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlatformAccount'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createPlatformUser
      summary: Invite a platform user
      description: The user is `invited` until they set a password from the one-time link (7 days), shown once. They set up two-step sign-in at first sign-in.
      tags:
        - platform
      x-platform: true
      x-module: sad
      x-parity: Web-only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - name
              properties:
                email:
                  type: string
                  maxLength: 254
                name:
                  type: string
                  maxLength: 200
      responses:
        '201':
          description: Invited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformAccountWithLink'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /platform/users/{userId}/{action}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: action
        in: path
        required: true
        schema:
          type: string
          enum:
            - disable
            - enable
            - reset-mfa
            - reset-password
    post:
      operationId: changePlatformUser
      summary: Disable, enable, reset the authenticator or the password
      description: |
        Nobody can do these to themselves (409 `self_action`), and the last active platform user cannot be disabled
        (409 `last_active`). Disabling and both resets end every session of that user. `reset-password` returns a
        one-time link (24 hours), shown once.
      tags:
        - platform
      x-platform: true
      x-module: sad
      x-parity: Web-only
      responses:
        '200':
          description: Done. `link` is present only for reset-password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformAccountWithLink'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /platform/auth/invite/accept:
    post:
      operationId: platformAcceptInvite
      summary: Set a platform password from a one-time link
      tags:
        - platform
      security: []
      x-public: true
      x-module: platform
      x-parity: Web-only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - password
              properties:
                token:
                  type: string
                  minLength: 20
                  maxLength: 128
                password:
                  type: string
                  maxLength: 256
      responses:
        '204':
          description: Password set; the user can sign in.
        '400':
          $ref: '#/components/responses/BadRequest'
  /students/{studentId}/photo/upload:
    parameters:
      - name: studentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: beginStudentPhotoUpload
      summary: Get a signed link to upload a student's photo
      description: |
        JPEG, PNG or WebP, at most 5 MB. PUT the bytes to `uploadUrl` with exactly `headers` within 10 minutes, then
        confirm with PUT /students/{studentId}/photo.
      tags:
        - stu
      x-permission: stu.students.edit
      x-module: stu
      x-parity: Companion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - contentType
                - sizeBytes
              properties:
                contentType:
                  type: string
                  enum:
                    - image/jpeg
                    - image/png
                    - image/webp
                sizeBytes:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 5242880
      responses:
        '201':
          description: The link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoUpload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /students/{studentId}/photo:
    parameters:
      - name: studentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getStudentPhoto
      summary: A short-lived link to a student's photo
      description: Only for someone who may read the student. The link lasts 5 minutes; every view is audited. 404 when the student has no photo.
      tags:
        - stu
      x-permission: stu.students.view
      x-module: stu
      x-parity: Companion
      responses:
        '200':
          description: The link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoLink'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: setStudentPhoto
      summary: Confirm an uploaded photo and make it the student's photo
      description: |
        The server reads the uploaded object back: its real type and size must be allowed, or it is removed and the
        answer is 400 `bad_upload`. The previous photo is removed.
      tags:
        - stu
      x-permission: stu.students.edit
      x-module: stu
      x-parity: Companion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fileId
              properties:
                fileId:
                  type: string
                  format: uuid
      responses:
        '204':
          description: Saved.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: removeStudentPhoto
      summary: Remove a student's photo
      tags:
        - stu
      x-permission: stu.students.edit
      x-module: stu
      x-parity: Companion
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Health:
      type: object
      required:
        - status
        - version
        - time
      properties:
        status:
          type: string
          enum:
            - ok
        version:
          type: string
          example: 0.1.0
        time:
          type: string
          format: date-time
    AccessUser:
      type: object
      required:
        - id
        - name
        - tier
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        tier:
          type: string
          enum:
            - tenant
            - platform
    AccessTenant:
      type: object
      description: The institute the session is bound to. Absent for platform-tier users who have not entered an institute.
      required:
        - id
        - name
        - brand
        - modules
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        brand:
          type: object
          required:
            - primary
          properties:
            primary:
              type: string
              pattern: ^#[0-9A-Fa-f]{6}$
            preset:
              type: string
              enum:
                - classic
                - modern
                - contrast
              description: Design preset (decision 0005). Absent means classic.
        modules:
          type: array
          items:
            type: string
    SupportVisitInfo:
      type: object
      description: Present only during a read-only support visit, so the app shows a banner.
      required:
        - by
        - reason
        - expiresAt
      properties:
        by:
          type: string
          description: The platform user's name.
        reason:
          type: string
        expiresAt:
          type: string
          format: date-time
    NavItem:
      type: object
      description: |
        One navigation entry. Paths and routes are NOT sent; each client resolves `screenId`
        through the shared screen registry (FND-28).
      required:
        - screenId
        - label
        - order
      properties:
        screenId:
          type: string
          example: attendance.capture
        label:
          type: string
        icon:
          type: string
        parentId:
          type: string
          nullable: true
        order:
          type: integer
    AccessPayload:
      type: object
      required:
        - user
        - permissions
        - scopes
        - fieldMasks
        - workspace
        - mobile
        - approvals
        - version
      properties:
        user:
          $ref: '#/components/schemas/AccessUser'
        tenant:
          $ref: '#/components/schemas/AccessTenant'
        visit:
          $ref: '#/components/schemas/SupportVisitInfo'
        permissions:
          type: array
          items:
            type: string
            example: fee.payments.create
        scopes:
          type: object
          description: Resource → scope grants, e.g. `class_section:12`, `own_children:77`.
          additionalProperties:
            type: array
            items:
              type: string
        fieldMasks:
          type: object
          description: Resource → fields the caller must not see (omitted from responses).
          additionalProperties:
            type: array
            items:
              type: string
        workspace:
          type: object
          required:
            - home
            - navigation
          properties:
            home:
              type: string
              example: teacher
            navigation:
              type: array
              items:
                $ref: '#/components/schemas/NavItem'
        mobile:
          type: object
          required:
            - tabs
            - features
          properties:
            tabs:
              type: array
              maxItems: 5
              items:
                type: string
            features:
              type: array
              items:
                type: string
        approvals:
          type: object
          required:
            - canApprove
          properties:
            canApprove:
              type: array
              items:
                type: string
        version:
          type: integer
          description: Increments whenever the caller's roles, grants, scopes or the institute's modules change.
    ProblemFieldError:
      type: object
      description: One field-level validation failure.
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
          example: guardianPhone
        code:
          type: string
          description: Stable machine code; clients map it to a translated message.
          example: invalid_phone
        message:
          type: string
          example: Enter a valid phone number.
    Problem:
      type: object
      description: RFC 9457 problem details. `code` is a stable machine-readable error code.
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Forbidden
        status:
          type: integer
          example: 403
        code:
          type: string
          example: permission_denied
        detail:
          type: string
        instance:
          type: string
        requestId:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ProblemFieldError'
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 256
          format: password
    TokenResponse:
      type: object
      required:
        - accessToken
        - accessTokenExpiresAt
        - refreshTokenExpiresAt
        - mustChangePassword
      properties:
        accessToken:
          type: string
          description: Short-lived bearer token (15 minutes).
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
          description: |
            Opaque single-use token for mobile clients; store it in the platform secure store.
            Omitted for web clients, which receive it as an httpOnly cookie instead.
        refreshTokenExpiresAt:
          type: string
          format: date-time
        mustChangePassword:
          type: boolean
    MfaChallenge:
      type: object
      required:
        - mfaRequired
        - challengeToken
        - expiresAt
      properties:
        mfaRequired:
          type: string
          enum:
            - verify
            - setup
          description: 'verify: ask for a code. setup: the account must set up two-step sign-in now (Admins).'
        challengeToken:
          type: string
          description: Single use, 10 minutes. Send it with the code.
        expiresAt:
          type: string
          format: date-time
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 20
          maxLength: 128
    Room:
      type: object
      required:
        - id
        - code
        - name
        - type
        - capacity
        - building
        - floor
        - availableForTimetable
        - displayOrder
        - description
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          nullable: true
          maxLength: 20
        name:
          type: string
          maxLength: 100
        type:
          type: string
          nullable: true
          enum:
            - classroom
            - lab
            - library
            - hall
            - staff
            - other
        capacity:
          type: integer
          minimum: 1
          maximum: 10000
        building:
          type: string
          nullable: true
          maxLength: 100
        floor:
          type: string
          nullable: true
          maxLength: 20
        availableForTimetable:
          type: boolean
        displayOrder:
          type: integer
          minimum: 0
          maximum: 100000
        description:
          type: string
          nullable: true
          maxLength: 500
        status:
          type: string
          enum:
            - active
            - inactive
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PageInfo:
      type: object
      description: Pagination metadata returned by every list endpoint.
      required:
        - number
        - size
        - total
      properties:
        number:
          type: integer
          minimum: 1
          example: 1
        size:
          type: integer
          minimum: 1
          maximum: 200
          example: 50
        total:
          type: integer
          minimum: 0
          example: 209
    RoomPage:
      type: object
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Room'
        page:
          $ref: '#/components/schemas/PageInfo'
    RoomInput:
      type: object
      description: Every field is replaced on update. Blank optional text is stored as null.
      required:
        - name
        - capacity
      properties:
        code:
          type: string
          nullable: true
          maxLength: 20
          description: Unique among the institute's rooms, ignoring case.
        name:
          type: string
          maxLength: 100
        type:
          type: string
          nullable: true
          enum:
            - classroom
            - lab
            - library
            - hall
            - staff
            - other
        capacity:
          type: integer
          minimum: 1
          maximum: 10000
        building:
          type: string
          nullable: true
          maxLength: 100
        floor:
          type: string
          nullable: true
          maxLength: 20
        availableForTimetable:
          type: boolean
          default: true
        displayOrder:
          type: integer
          minimum: 0
          maximum: 100000
          default: 0
        description:
          type: string
          nullable: true
          maxLength: 500
