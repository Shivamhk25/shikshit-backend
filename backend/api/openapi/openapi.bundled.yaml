        - id
        - email
        - name
        - status
        - mfaEnabled
        - lastLoginAt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
            - invited
            - active
            - disabled
        mfaEnabled:
          type: boolean
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    PlatformAccountWithLink:
      allOf:
        - $ref: '#/components/schemas/PlatformAccount'
