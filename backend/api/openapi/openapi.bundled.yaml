        - items
        - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AcademicYear'
        page:
          $ref: '#/components/schemas/PageInfo'
    AcademicYearInput:
      type: object
      description: Every field is replaced on update. Blank optional text is stored as null.
      required:
        - code
        - name
        - startDate
        - endDate
      properties:
        code:
          type: string
          maxLength: 20
        name:
          type: string
          maxLength: 100
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          description: Must be after the start date and must not overlap another year.
        isCurrent:
