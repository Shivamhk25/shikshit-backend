          required:
            - inviteLink
            - emailQueued
          properties:
            inviteLink:
              type: string
              description: One-time invite link (valid 7 days). Only returned once.
            emailQueued:
              type: boolean
              description: True when the link was also queued for email to the user's address (FND-19). False when email is not configured or the user has no email; share the link by hand.
    UserUpdateInput:
      type: object
      description: Every field is optional; blank optional text is stored as null. Username cannot be changed.
      properties:
        displayName:
          type: string
          nullable: true
          maxLength: 200
        email:
          type: string
          nullable: true
          maxLength: 254
        phone:
          type: string
          nullable: true
          maxLength: 30
        personType:
          type: string
          nullable: true
          enum:
            - student
            - guardian
          description: Staff links arrive with staff records.
        personId:
          type: string
          format: uuid
          nullable: true
    UserWithResetLink:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required:
            - resetLink
            - emailQueued
          properties:
            resetLink:
              type: string
              description: One-time password reset link (valid 24 hours). Only returned once.
            emailQueued:
              type: boolean
              description: True when the link was also queued for email to the user's address (FND-19).
    AcceptInviteInput:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
