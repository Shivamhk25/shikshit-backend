        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        page:
          $ref: '#/components/schemas/PageInfo'
    UserCreateInput:
      type: object
      required:
        - username
        - displayName
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        displayName:
          type: string
          maxLength: 200
        email:
          type: string
          nullable: true
          maxLength: 254
        phone:
          type: string
          nullable: true
          maxLength: 30
        personType:
          type: string
          nullable: true
          enum:
            - student
            - guardian
