      summary: Delete a elective group (soft delete; its code can be reused)
      tags:
        - aca
      x-permission: aca.elective_groups.delete
      x-module: aca
      x-parity: Companion
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /onboarding/entities:
    get:
      operationId: listImportEntities
      summary: List the kinds of data the caller can import
      tags:
        - onboarding
      x-permission: onb.imports.view
      x-module: onb
      x-parity: Both
      responses:
        '200':
          description: Importable entities with their columns.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportEntityList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /onboarding/templates/{entity}:
    parameters:
      - name: entity
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: downloadImportTemplate
      summary: Download the CSV template for an entity
      tags:
        - onboarding
      x-permission: onb.imports.import
      x-module: onb
      x-parity: Both
      responses:
        '200':
          description: A CSV file with the header row and one example row.
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /onboarding/packs/{pack}:
    parameters:
      - name: pack
        in: path
        required: true
        schema:
          type: string
          example: academic
    get:
      operationId: getImportPack
      summary: Where the institute stands on a setup pack
      description: |
        The steps of a pack in order, how much data each already has, which step to do next, and whether the pack is
        ready. The caller needs the pack's domain permission (`onb.<domain>.view`); without it the pack does not exist.
      tags:
        - onboarding
      x-permission: onb.imports.view
      x-module: onb
      x-parity: Both
      responses:
        '200':
          description: The pack and its status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportPack'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /onboarding/imports:
    get:
      operationId: listImportBatches
      summary: List uploaded files
      tags:
        - onboarding
      x-permission: onb.imports.view
      x-module: onb
      x-parity: Both
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sort
          in: query
          description: Comma-separated keys, `-` prefix for descending. Allowed `createdAt, status, entity`.
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ImportBatchStatus'
        - name: entity
          in: query
          schema:
            type: string
      responses:
        '200':
          description: One page of batches, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatchPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: uploadImport
      summary: Upload a CSV or Excel file for checking
      description: |
        The file is read and staged, then checked in the background (poll the batch until `status` is `validated`).
        Nothing is saved to the institute's records until the batch is committed. Limits: 10 MB, 20,000 rows.
      tags:
        - onboarding
      x-permission: onb.imports.import
      x-module: onb
      x-parity: Both
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - entity
                - file
              properties:
                entity:
                  type: string
                  example: school_divisions
                strategy:
                  type: string
                  enum:
                    - insert
                    - update
                    - upsert
                  default: upsert
                commitMode:
                  type: string
                  enum:
                    - all_or_nothing
                    - skip_invalid
                  default: all_or_nothing
                file:
                  type: string
                  format: binary
      responses:
        '202':
          description: Accepted; checking has been queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /onboarding/imports/{batchId}:
    parameters:
      - $ref: '#/components/parameters/BatchId'
    get:
      operationId: getImportBatch
      summary: Get an uploaded file's progress and counts
      tags:
        - onboarding
      x-permission: onb.imports.view
      x-module: onb
      x-parity: Both
      responses:
        '200':
          description: The batch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /onboarding/imports/{batchId}/rows:
    parameters:
      - $ref: '#/components/parameters/BatchId'
    get:
      operationId: listImportRows
      summary: List the rows of an uploaded file with what was found
      tags:
        - onboarding
      x-permission: onb.imports.view
      x-module: onb
      x-parity: Both
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ImportRowStatus'
      responses:
        '200':
          description: One page of rows, in file order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportRowPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /onboarding/imports/{batchId}/errors.csv:
    parameters:
      - $ref: '#/components/parameters/BatchId'
    get:
      operationId: downloadImportErrors
      summary: Download the rows that need fixing, with the reason for each
      tags:
        - onboarding
      x-permission: onb.imports.view
      x-module: onb
      x-parity: Both
      responses:
        '200':
          description: A CSV file in the template's columns plus a Problems column. Fix it and upload it again.
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /onboarding/imports/{batchId}/commit:
    parameters:
      - $ref: '#/components/parameters/BatchId'
    post:
      operationId: commitImportBatch
      summary: Import the checked file
      tags:
        - onboarding
      x-permission: onb.imports.commit
      x-module: onb
      x-parity: Both
      responses:
        '202':
          description: Accepted; the import has been queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /onboarding/imports/{batchId}/approve:
    parameters:
      - $ref: '#/components/parameters/BatchId'
    post:
      operationId: approveImportBatch
      summary: Approve a checked file and import it
      description: |
        For an institute that requires approval, someone other than the uploader approves the file and it is imported
        in the same step. The uploader cannot approve their own file. Needs `onb.imports.review` and the data
        domain's `review` permission.
      tags:
        - onboarding
      x-permission: onb.imports.review
      x-module: onb
      x-parity: Both
      responses:
        '202':
          description: Approved; the import has been queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /onboarding/imports/{batchId}/reject:
    parameters:
      - $ref: '#/components/parameters/BatchId'
    post:
      operationId: rejectImportBatch
      summary: Reject a file that is waiting for approval
      description: The reason is kept and shown to the uploader. A rejected file is final; the data is fixed and uploaded again.
      tags:
        - onboarding
      x-permission: onb.imports.review
      x-module: onb
      x-parity: Both
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /onboarding/imports/{batchId}/rollback:
    parameters:
      - $ref: '#/components/parameters/BatchId'
    post:
      operationId: rollbackImportBatch
      summary: Undo an import (within 7 days)
      description: Records changed after the import are left as they are and reported on their row.
      tags:
        - onboarding
      x-permission: onb.imports.rollback
      x-module: onb
      x-parity: Both
      responses:
        '202':
          description: Accepted; the rollback has been queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Health:
      type: object
      required:
        - status
        - version
        - time
      properties:
        status:
          type: string
          enum:
            - ok
        version:
          type: string
          example: 0.1.0
        time:
          type: string
          format: date-time
    AccessUser:
      type: object
      required:
        - id
        - name
        - tier
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        tier:
          type: string
          enum:
            - tenant
            - platform
    AccessTenant:
      type: object
      description: The institute the session is bound to. Absent for platform-tier users who have not entered an institute.
      required:
        - id
        - name
        - brand
        - modules
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        brand:
          type: object
          required:
            - primary
          properties:
            primary:
              type: string
              pattern: ^#[0-9A-Fa-f]{6}$
        modules:
          type: array
          items:
            type: string
    NavItem:
      type: object
      description: |
        One navigation entry. Paths and routes are NOT sent; each client resolves `screenId`
        through the shared screen registry (FND-28).
      required:
        - screenId
        - label
        - order
      properties:
        screenId:
          type: string
          example: attendance.capture
        label:
          type: string
        icon:
          type: string
        parentId:
          type: string
          nullable: true
        order:
          type: integer
    AccessPayload:
      type: object
      required:
        - user
        - permissions
        - scopes
        - fieldMasks
        - workspace
        - mobile
        - approvals
        - version
      properties:
        user:
          $ref: '#/components/schemas/AccessUser'
        tenant:
          $ref: '#/components/schemas/AccessTenant'
        permissions:
          type: array
          items:
            type: string
            example: fee.payments.create
        scopes:
          type: object
          description: Resource → scope grants, e.g. `class_section:12`, `own_children:77`.
          additionalProperties:
            type: array
            items:
              type: string
        fieldMasks:
          type: object
          description: Resource → fields the caller must not see (omitted from responses).
          additionalProperties:
            type: array
            items:
              type: string
        workspace:
          type: object
          required:
            - home
            - navigation
          properties:
            home:
              type: string
              example: teacher
            navigation:
              type: array
              items:
                $ref: '#/components/schemas/NavItem'
        mobile:
          type: object
          required:
            - tabs
            - features
          properties:
            tabs:
              type: array
              maxItems: 5
              items:
                type: string
            features:
              type: array
              items:
                type: string
        approvals:
          type: object
          required:
            - canApprove
          properties:
            canApprove:
              type: array
              items:
                type: string
        version:
          type: integer
          description: Increments whenever the caller's roles, grants, scopes or the institute's modules change.
    ProblemFieldError:
      type: object
      description: One field-level validation failure.
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
          example: guardianPhone
        code:
          type: string
          description: Stable machine code; clients map it to a translated message.
          example: invalid_phone
        message:
          type: string
          example: Enter a valid phone number.
    Problem:
      type: object
      description: RFC 9457 problem details. `code` is a stable machine-readable error code.
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Forbidden
        status:
          type: integer
          example: 403
        code:
          type: string
          example: permission_denied
        detail:
          type: string
        instance:
          type: string
        requestId:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ProblemFieldError'
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 256
          format: password
    TokenResponse:
      type: object
      required:
        - accessToken
        - accessTokenExpiresAt
        - refreshTokenExpiresAt
        - mustChangePassword
      properties:
        accessToken:
          type: string
          description: Short-lived bearer token (15 minutes).
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
          description: |
            Opaque single-use token for mobile clients; store it in the platform secure store.
            Omitted for web clients, which receive it as an httpOnly cookie instead.
        refreshTokenExpiresAt:
          type: string
          format: date-time
        mustChangePassword:
          type: boolean
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 20
          maxLength: 128
    Room:
      type: object
      required:
        - id
        - code
        - name
        - type
        - capacity
        - building
        - floor
        - availableForTimetable
        - displayOrder
        - description
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          nullable: true
          maxLength: 20
        name:
          type: string
          maxLength: 100
        type:
          type: string
          nullable: true
          enum:
            - classroom
            - lab
            - library
            - hall
            - staff
            - other
        capacity:
          type: integer
          minimum: 1
          maximum: 10000
        building:
          type: string
          nullable: true
          maxLength: 100
        floor:
          type: string
          nullable: true
          maxLength: 20
        availableForTimetable:
          type: boolean
        displayOrder:
          type: integer
          minimum: 0
          maximum: 100000
        description:
          type: string
          nullable: true
          maxLength: 500
        status:
          type: string
          enum:
            - active
            - inactive
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PageInfo:
      type: object
      description: Pagination metadata returned by every list endpoint.
      required:
        - number
        - size
        - total
      properties:
        number:
          type: integer
          minimum: 1
          example: 1
        size:
          type: integer
          minimum: 1
          maximum: 200
          example: 50
        total:
          type: integer
          minimum: 0
          example: 209
    RoomPage:
      type: object
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Room'
        page:
          $ref: '#/components/schemas/PageInfo'
    RoomInput:
      type: object
      description: Every field is replaced on update. Blank optional text is stored as null.
      required:
        - name
        - capacity
      properties:
        code:
          type: string
          nullable: true
          maxLength: 20
          description: Unique among the institute's rooms, ignoring case.
        name:
          type: string
          maxLength: 100
        type:
          type: string
          nullable: true
          enum:
            - classroom
            - lab
            - library
            - hall
            - staff
            - other
        capacity:
          type: integer
          minimum: 1
          maximum: 10000
        building:
          type: string
          nullable: true
          maxLength: 100
        floor:
          type: string
          nullable: true
          maxLength: 20
        availableForTimetable:
          type: boolean
          default: true
        displayOrder:
          type: integer
          minimum: 0
          maximum: 100000
          default: 0
        description:
          type: string
          nullable: true
          maxLength: 500
        status:
          type: string
          enum:
            - active
            - inactive
          default: active
    AcademicYear:
      type: object
      required:
        - id
        - code
        - name
        - startDate
        - endDate
        - isCurrent
        - remarks
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 20
        name:
          type: string
          maxLength: 100
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        isCurrent:
          type: boolean
        remarks:
          type: string
          nullable: true
          maxLength: 500
        status:
          type: string
          enum:
            - active
            - inactive
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AcademicYearPage:
      type: object
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AcademicYear'
        page:
          $ref: '#/components/schemas/PageInfo'
    AcademicYearInput:
      type: object
      description: Every field is replaced on update. Blank optional text is stored as null.
      required:
        - code
        - name
        - startDate
        - endDate
      properties:
        code:
          type: string
          maxLength: 20
        name:
          type: string
          maxLength: 100
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          description: Must be after the start date and must not overlap another year.
        isCurrent:
          type: boolean
          default: false
          description: Only one year can be current; it must be active.
        remarks:
          type: string
          nullable: true
          maxLength: 500
        status:
          type: string
          enum:
            - active
            - inactive
          default: active
    AcademicTerm:
      type: object
      required:
        - id
        - yearId
        - yearName
        - code
        - title
        - startDate
        - endDate
        - days
        - color
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        yearId:
          type: string
          format: uuid
        yearName:
          type: string
        code:
          type: string
          maxLength: 20
        title:
          type: string
          maxLength: 100
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        days:
          type: integer
          description: Number of days, counting both end dates.
        color:
          type: string
          nullable: true
          pattern: ^#[0-9A-Fa-f]{6}$
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AcademicTermPage:
      type: object
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AcademicTerm'
        page:
          $ref: '#/components/schemas/PageInfo'
    AcademicTermInput:
      type: object
      description: Every field is replaced on update. Blank optional text is stored as null.
      required:
        - yearId
        - code
        - title
        - startDate
        - endDate
      properties:
        yearId:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 20
          description: Unique within the year.
        title:
          type: string
          maxLength: 100
        startDate:
          type: string
          format: date
          description: Inside the academic year.
        endDate:
          type: string
          format: date
          description: Inside the academic year; terms of one year must not overlap.
        color:
          type: string
          nullable: true
          pattern: ^#[0-9A-Fa-f]{6}$
    SchoolClass:
      type: object
      required:
        - id
        - code
        - name
        - divisionId
        - divisionName
        - displayOrder
        - youngestAgeMonths
        - oldestAgeMonths
        - description
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 20
        name:
          type: string
          maxLength: 100
        divisionId:
          type: string
          format: uuid
          nullable: true
        divisionName:
          type: string
          nullable: true
        displayOrder:
          type: integer
          minimum: 0
          maximum: 100000
        youngestAgeMonths:
          type: integer
          nullable: true
          minimum: 0
          maximum: 600
        oldestAgeMonths:
          type: integer
          nullable: true
          minimum: 0
          maximum: 600
        description:
          type: string
          nullable: true
          maxLength: 500
        status:
          type: string
          enum:
            - active
            - inactive
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SchoolClassPage:
      type: object
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SchoolClass'
        page:
          $ref: '#/components/schemas/PageInfo'
    SchoolClassInput:
      type: object
      description: Every field is replaced on update. Blank optional text is stored as null.
