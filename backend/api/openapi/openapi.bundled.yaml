          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        isSystem:
          type: boolean
          description: 'Built-in: read-only, clone to customise.'
        holderCount:
          type: integer
          description: People holding the role now.
        permissionCount:
          type: integer
        updatedAt:
          type: string
          format: date-time
    RoleGrant:
      type: object
      required:
        - permission
