          schema:
            type: string
        - $ref: '#/components/parameters/Search'
        - name: state
          in: query
          schema:
            type: string
            enum:
              - ready
              - admitted
            default: ready
        - name: classId
          in: query
          schema:
            type: string
            format: uuid
        - name: yearId
          in: query
          schema:
            type: string
            format: uuid
