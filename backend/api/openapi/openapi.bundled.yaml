        password:
          type: string
          minLength: 10
          maxLength: 128
          description: 'New password: 10 to 128 characters, not the username.'
    AcceptInviteResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Your password has been set. You can now sign in.
    MfaCodeRequest:
      type: object
      required:
        - challengeToken
        - code
      properties:
        challengeToken:
          type: string
          minLength: 20
          maxLength: 128
        code:
          type: string
          minLength: 6
          maxLength: 20
    MfaSetup:
      type: object
      required:
        - secret
        - otpauthUri
      properties:
        secret:
          type: string
          description: Base32 key in groups of four, for typing into the app.
        otpauthUri:
          type: string
          description: otpauth:// link for a QR code, or to tap on the phone.
    MfaStatus:
      type: object
      required:
        - enabled
        - required
        - recoveryCodesLeft
      properties:
        enabled:
          type: boolean
        required:
          type: boolean
          description: The institute requires it for this account; it cannot be turned off.
        recoveryCodesLeft:
          type: integer
    MfaCode:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 20
          description: 6-digit code from the app, or a recovery code.
    CatalogPermission:
      type: object
      required:
        - code
        - module
        - resource
        - action
        - sensitive
      properties:
        code:
          type: string
          example: stu.students.view
        module:
          type: string
        resource:
          type: string
        action:
          type: string
        sensitive:
          type: boolean
          description: Touches personal or financial data; the matrix marks it.
    Role:
      type: object
      required:
        - id
        - code
        - name
        - description
        - isSystem
        - holderCount
        - permissionCount
        - updatedAt
