          example: Principal, Teacher
    ColleaguePage:
      type: object
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Colleague'
        page:
          $ref: '#/components/schemas/PageInfo'
    ApprovalStatus:
      type: string
      enum:
        - pending
        - approved
        - rejected
        - cancelled
    Approval:
      type: object
      required:
        - id
        - typeKey
        - typeTitle
        - subjectId
        - summary
        - amount
        - requesterId
        - requesterName
        - status
        - currentStep
        - stepCount
        - stepName
        - createdAt
        - decidedAt
      properties:
        id:
          type: string
          format: uuid
        typeKey:
          type: string
          description: The workflow type, for example `fee.concession`.
        typeTitle:
          type: string
        subjectId:
          type: string
          description: The id of the record in the module that asked for approval.
        summary:
          type: string
        amount:
          type: number
          format: double
          nullable: true
        requesterId:
          type: string
          format: uuid
        requesterName:
          type: string
        status:
          $ref: '#/components/schemas/ApprovalStatus'
        currentStep:
          type: integer
          minimum: 1
        stepCount:
          type: integer
          minimum: 1
        stepName:
          type: string
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
          nullable: true
        delegatedFromId:
          type: string
          format: uuid
          nullable: true
          description: Set when the caller may decide it only because this person handed their approvals over (delegation).
        delegatedFromName:
          type: string
          nullable: true
    ApprovalPage:
      type: object
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Approval'
        page:
          $ref: '#/components/schemas/PageInfo'
    ApprovalDelegation:
      type: object
      required:
        - id
        - delegatorId
        - delegatorName
        - delegateId
        - delegateName
        - startsAt
        - endsAt
        - reason
        - typeKeys
        - endedAt
        - createdAt
        - status
      properties:
        id:
          type: string
          format: uuid
        delegatorId:
          type: string
          format: uuid
        delegatorName:
          type: string
        delegateId:
          type: string
          format: uuid
        delegateName:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        reason:
          type: string
        typeKeys:
          type: array
          nullable: true
          items:
            type: string
          description: Null means every workflow type.
        endedAt:
          type: string
          format: date-time
          nullable: true
          description: When the delegator ended it early.
        createdAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - scheduled
            - active
            - ended
            - expired
    ApprovalDelegationList:
      type: object
      required:
        - given
        - received
      properties:
        given:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalDelegation'
        received:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalDelegation'
    ApprovalDelegationInput:
      type: object
      required:
        - delegateId
        - endsAt
      properties:
        delegateId:
          type: string
          format: uuid
          description: An active user of the same institute.
        startsAt:
          type: string
          format: date-time
          description: Defaults to now.
        endsAt:
          type: string
          format: date-time
          description: At most 90 days after the start.
        reason:
          type: string
          maxLength: 300
        typeKeys:
          type: array
          maxItems: 50
          items:
            type: string
          description: Limit the delegation to these workflow types. Leave out for all.
    ApprovalStep:
      type: object
      required:
        - step
        - name
        - status
        - decidedBy
        - decidedAt
      properties:
        step:
          type: integer
        name:
          type: string
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected
        decidedBy:
          type: string
          nullable: true
          description: Name of the person who decided.
        decidedAt:
          type: string
          format: date-time
          nullable: true
    ApprovalEvent:
      type: object
      required:
        - step
        - actorId
        - actorName
        - action
        - comment
        - createdAt
      properties:
        step:
          type: integer
          nullable: true
        actorId:
          type: string
          format: uuid
        actorName:
          type: string
        action:
          type: string
          enum:
            - submitted
            - approved
            - rejected
            - cancelled
        comment:
          type: string
        createdAt:
          type: string
          format: date-time
        onBehalfOfId:
          type: string
          format: uuid
          nullable: true
          description: Set when the actor decided through a delegation, on behalf of this person.
        onBehalfOfName:
          type: string
          nullable: true
    ApprovalDetail:
      allOf:
        - $ref: '#/components/schemas/Approval'
