        youngestAgeMonths:
          type: integer
          nullable: true
          minimum: 0
          maximum: 600
        oldestAgeMonths:
          type: integer
          nullable: true
          minimum: 0
          maximum: 600
        description:
          type: string
          nullable: true
          maxLength: 500
        status:
          type: string
          enum:
            - active
            - inactive
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SchoolClassPage:
      type: object
      required:
        - items
        - page
      properties:
        items:
          type: array
