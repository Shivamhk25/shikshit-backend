        title:
          type: string
        body:
          type: string
        link:
          type: string
          nullable: true
          description: A path inside the app that starts with `/`.
        createdAt:
          type: string
          format: date-time
        readAt:
          type: string
          format: date-time
          nullable: true
    NotificationPage:
