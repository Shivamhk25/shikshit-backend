          required:
            - steps
            - events
            - canDecide
            - canCancel
          properties:
            steps:
              type: array
              items:
                $ref: '#/components/schemas/ApprovalStep'
            events:
              type: array
              items:
                $ref: '#/components/schemas/ApprovalEvent'
            canDecide:
              type: boolean
              description: True when the caller may approve or reject it right now.
            canCancel:
              type: boolean
              description: True when the caller made it and it is still open.
    ApprovalDecision:
      type: object
      properties:
        comment:
          type: string
          maxLength: 1000
          description: Required when rejecting.
        step:
          type: integer
          minimum: 1
          description: The step the approver was looking at. A request that has moved on is refused with 409.
    PlatformUser:
      type: object
      required:
        - id
        - email
        - name
