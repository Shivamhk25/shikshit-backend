            $ref: '#/components/schemas/ImportBatchStatus'
        - name: entity
          in: query
          schema:
            type: string
        - name: awaitingApproval
          in: query
          description: Only checked files that still need approval from someone other than the uploader.
          schema:
            type: boolean
      responses:
        '200':
          description: One page of batches, newest first.
          content:
