            - suspended
            - archived
        planCode:
          type: string
          nullable: true
        planName:
          type: string
          nullable: true
        modules:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        wentLiveAt:
          type: string
          format: date-time
          nullable: true
    InstitutePage:
      type: object
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Institute'
        page:
          $ref: '#/components/schemas/PageInfo'
    InstituteCreateInput:
      type: object
      required:
        - code
        - name
