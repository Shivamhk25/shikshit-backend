          maxLength: 100
        displayOrder:
          type: integer
          minimum: 0
          maximum: 100000
          default: 0
        youngestAgeMonths:
          type: integer
          nullable: true
          minimum: 0
          maximum: 600
        oldestAgeMonths:
          type: integer
          nullable: true
          minimum: 0
          maximum: 600
          description: Not below the youngest age.
        description:
          type: string
          nullable: true
          maxLength: 500
        status:
          type: string
          enum:
            - active
            - inactive
          default: active
    Section:
      type: object
      required:
        - id
        - code
        - name
        - shortName
        - description
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 20
        name:
          type: string
          maxLength: 100
        shortName:
          type: string
          nullable: true
          maxLength: 20
        description:
          type: string
          nullable: true
          maxLength: 500
        status:
          type: string
          enum:
            - active
            - inactive
        createdAt:
          type: string
          format: date-time
