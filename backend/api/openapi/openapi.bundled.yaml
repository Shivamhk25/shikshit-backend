        yearId:
          type: string
          format: uuid
        yearName:
          type: string
        code:
          type: string
          maxLength: 20
        title:
          type: string
          maxLength: 100
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        days:
