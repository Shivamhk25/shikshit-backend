        scope:
          type: string
          enum:
            - tenant
            - campus
            - department
            - class_section
            - assigned_route
            - assigned_hostel
            - own_children
            - self
            - owned
          description: tenant = the whole school; class_section = only the class sections assigned to the holder.
    RoleInput:
      type: object
