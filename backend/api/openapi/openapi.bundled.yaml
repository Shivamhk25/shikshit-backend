openapi: 3.0.3
info:
  title: Shikshit API
  version: 0.1.0
  description: |
    Single source of truth for the Shikshit backend, web and mobile clients.
    Contract-first: change this spec first, then run `make api-gen`.
    Conventions: docs/plan/03-architecture-contracts.md. Access model: docs/plan/01-access-model.md.

    Every operation MUST declare one of:
      - `x-permission: <module>.<resource>.<action>`  (role permission, enforced server-side)
      - `x-authenticated: true`                       (any signed-in user)
      - `x-public: true`                              (no authentication)
      - `x-platform: true`                            (a signed-in platform user, Super Admin tier)
    Optional: `x-module`, `x-scope`, `x-parity` (Both | Companion | Web-only | Platform), `x-screen-id`.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: platform
    description: Health, session access payload, client configuration.
  - name: onboarding
    description: Data onboarding imports.
  - name: approvals
    description: Approval requests and decisions.
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe
      tags:
        - platform
      security: []
      x-public: true
      x-module: platform
      x-parity: Platform
      responses:
        '200':
          description: The service is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /me/access:
    get:
      operationId: getMyAccess
      summary: What the signed-in user may see and do
      description: |
        Single payload used by web and mobile to build navigation and gate features.
        Nothing here is trusted by the server; every endpoint re-checks permission and scope.
        Permissions are concrete codes: wildcards in role grants are expanded, per-user denies applied and permissions of
        modules the institute has not enabled removed. Scope lists are "tenant", "self", "owned" or `type:id` records.
      tags:
        - platform
      x-authenticated: true
      x-module: platform
      x-parity: Both
      parameters:
        - name: X-Client
          in: header
          description: Calling client, used to filter screens the client cannot render.
          schema:
            type: string
            enum:
              - web
              - ios
              - android
        - name: X-Client-Version
          in: header
          schema:
            type: string
            example: 1.4.0
      responses:
        '200':
          description: The caller's effective access.
          headers:
            X-Access-Version:
              $ref: '#/components/headers/AccessVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessPayload'
              example:
                user:
                  id: 3f6b1c2e-6a52-4b8e-9d1e-0f2a8f5c7a10
                  name: Asha Verma
                  tier: tenant
                tenant:
                  id: 9a1d0c44-2b7a-4c55-8f0e-5a6a9d3b2e01
                  name: Springfield Public School
                  brand:
                    primary: '#2F5BFF'
                  modules:
                    - attendance
                    - fee
                    - student
                permissions:
                  - attendance.register.view
                  - attendance.register.create
                scopes:
                  attendance.register:
                    - class_section:12
                    - class_section:14
                fieldMasks:
                  student.records:
                    - medical
                workspace:
                  home: teacher
                  navigation:
                    - screenId: today
                      label: Today
                      icon: sun
                      parentId: null
                      order: 1
                    - screenId: attendance.capture
                      label: Attendance
                      icon: check-square
                      parentId: null
                      order: 2
                mobile:
                  tabs:
                    - today
                    - classes
                    - inbox
                    - me
                  features:
                    - attendance.capture
                approvals:
                  canApprove:
                    - exam.marks
                version: 42
        '401':
          $ref: '#/components/responses/Unauthorized'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /auth/login:
    post:
      operationId: login
      summary: Sign in with username and password
      description: |
        Wrong username, wrong password, disabled account and Google-only account all return the same
        `401 invalid_credentials`, so the response does not reveal which usernames exist.
        After repeated failures the account locks; a correct password then returns `423 account_locked`.
      tags:
        - auth
      security: []
      x-public: true
      x-module: platform
      x-parity: Both
      parameters:
        - $ref: '#/components/parameters/XClient'
        - $ref: '#/components/parameters/XClientVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '202':
          description: |
            Password correct, a second step is needed (two-step sign-in, FND-05). No tokens yet: send a code to
            `/auth/mfa/verify`, or for `setup` get a secret from `/auth/mfa/setup` and confirm a code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaChallenge'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          description: The account is temporarily locked after too many failed attempts.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/refresh:
    post:
      operationId: refreshToken
      summary: Exchange a refresh token for new tokens
      description: |
        Refresh tokens rotate: each use returns a new one and invalidates the old one.
        Web clients (`X-Client: web`) keep the refresh token in an httpOnly cookie that scripts cannot read: send no body and
        the cookie is used. Mobile clients send the token in the body.
        Presenting an already-used token signs out every device that shared the session (`401 refresh_reuse`).
      tags:
        - auth
      security: []
      x-public: true
      x-module: platform
      x-parity: Both
      parameters:
        - $ref: '#/components/parameters/XClient'
        - $ref: '#/components/parameters/XClientVersion'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      operationId: logout
      summary: Sign out this session
      description: |
        Revokes the session the refresh token belongs to (taken from the body, or from the cookie for web clients) and
        clears the cookie. Idempotent; unknown or missing tokens also return 204.
      tags:
        - auth
      security: []
      x-public: true
      x-module: platform
      x-parity: Both
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Signed out.
        '400':
          $ref: '#/components/responses/BadRequest'
