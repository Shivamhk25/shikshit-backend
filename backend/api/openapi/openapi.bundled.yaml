        accent:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
          example: '#1F3A5F'
        preset:
          type: string
          enum:
            - classic
            - modern
            - contrast
          description: classic = serif titles, warm paper; modern = sans titles, cooler neutrals, rounder; contrast = high contrast for accessibility.
    Preferences:
      type: object
      required:
        - themeMode
      properties:
        themeMode:
          type: string
          enum:
            - light
            - dark
            - system
          description: system follows the device.
    Notification:
