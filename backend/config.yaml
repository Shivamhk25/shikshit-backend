# Application Configuration
app:
  name: "pie360-backend"
  version: "1.0.0"
  env: "development"  # development, staging, production
  host: "0.0.0.0"
  port: 8080
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s
  shutdown_grace_period: 15s

# Database Configuration
database:
  host: "localhost"
  port: 5432
  user: "pie360"
  password: "pie360_dev_password"
  name: "pie360"
  ssl_mode: "disable"
  max_conns: 25
  min_conns: 5
  max_conn_lifetime: 1h
  max_conn_idle_time: 30m
  health_check_period: 1m
  # PgBouncer (transaction pooling)
  pgbouncer:
    host: "localhost"
    port: 6432

# Redis Configuration
redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0
  pool_size: 50
  min_idle_conns: 10
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s
  # Sentinel (optional)
  sentinel:
    enabled: false
    master_name: ""
    addresses: []

# JWT Configuration
jwt:
  private_key_path: "./keys/private.pem"
  public_key_path: "./keys/public.pem"
  access_token_ttl: 15m
  refresh_token_ttl: 168h  # 7 days
  issuer: "pie360"
  audience: "pie360-frontend"
  algorithm: "RS256"

# Cookie Configuration
cookie:
  name: "pie360_session"
  domain: "localhost"
  path: "/"
  secure: false
  http_only: true
  same_site: "lax"
  max_age: 168h  # 7 days

# Casbin Configuration
casbin:
  model_path: "./config/rbac_model.conf"
  policy_path: "./config/rbac_policy.csv"
  redis_enabled: true
  redis_key: "casbin:policies"

# WebSocket Hub Configuration
websocket:
  read_buffer_size: 4096
  write_buffer_size: 4096
  ping_period: 30s
  pong_wait: 60s
  write_wait: 10s
  max_message_size: 512
  # Rate limiting per connection
  rate_limit:
    enabled: true
    requests_per_second: 50
    burst: 100

# CORS Configuration
cors:
  allowed_origins:
    - "http://localhost:5173"
    - "http://localhost:3000"
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "PATCH"
    - "DELETE"
    - "OPTIONS"
  allowed_headers:
    - "Origin"
    - "Content-Type"
    - "Accept"
    - "Authorization"
    - "X-Requested-With"
    - "X-Institute-ID"
  allow_credentials: true
  max_age: 86400

# Logging Configuration
logging:
  level: "debug"  # debug, info, warn, error
  format: "console"  # console, json
  output: "stdout"
  # File logging (optional)
  file:
    enabled: false
    path: "./logs/app.log"
    max_size_mb: 100
    max_backups: 3
    max_age_days: 28
    compress: true

# Email Configuration (SMTP)
email:
  host: "smtp.mailtrap.io"
  port: 2525
  username: ""
  password: ""
  from_address: "noreply@pie360.example.com"
  from_name: "PIE360 Platform"
  use_tls: true

# Storage Configuration (S3/MinIO)
storage:
  provider: "minio"  # minio, s3, gcs, azure
  endpoint: "localhost:9000"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  bucket: "pie360"
  region: "us-east-1"
  use_ssl: false
  public_url: "http://localhost:9000/pie360"

# Rate Limiting (API)
rate_limit:
  enabled: true
  requests_per_minute: 100
  burst: 20
  # Per-endpoint overrides
  endpoints:
    "/api/auth/login": "5/minute"
    "/api/auth/register": "3/minute"
    "/api/auth/forgot-password": "2/minute"

# Metrics & Monitoring
metrics:
  enabled: true
  path: "/metrics"
  port: 9090

# Tracing (OpenTelemetry)
tracing:
  enabled: false
  endpoint: "http://localhost:4317"
  service_name: "pie360-backend"
  sample_rate: 0.1